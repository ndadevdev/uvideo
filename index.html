<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uVideo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f0;
            min-height: 100vh;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #2563eb, transparent);
            animation: scan 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .logo em {
            font-style: normal;
            color: #2563eb;
        }

        .logo::after {
            content: '_';
            color: #2563eb;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .tagline {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-box {
            width: 100%;
            max-width: 580px;
        }

        .input-wrapper {
            background: #fff;
            border: 2px solid #e0e0e0;
            padding: 6px;
            display: flex;
            gap: 6px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #2563eb;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
        }

        .prefix {
            font-family: 'Space Mono', monospace;
            color: #2563eb;
            padding: 12px 0 12px 16px;
            font-size: 14px;
            user-select: none;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #1a1a1a;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            padding: 12px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #aaa;
        }

        .btn-paste {
            font-family: 'Space Mono', monospace;
            padding: 12px 16px;
            background: #e5e5e5;
            color: #555;
            border: none;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-paste:hover {
            background: #d4d4d4;
        }

        .btn-paste svg {
            width: 16px;
            height: 16px;
        }

        .btn {
            font-family: 'Space Mono', monospace;
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #ccc;
            color: #888;
            cursor: wait;
        }

        /* Progress */
        .progress-section {
            margin-top: 20px;
            display: none;
        }

        .progress-section.show {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-file {
            color: #666;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-percent {
            color: #2563eb;
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e5e5e5;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #2563eb;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: #888;
            margin-top: 8px;
        }

        .progress-speed {
            color: #2563eb;
        }

        /* Log */
        .log-output {
            margin-top: 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 16px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .log-output.show {
            display: block;
        }

        .log-line {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .log-line .time {
            color: #bbb;
        }

        .log-line .msg {
            color: #666;
        }

        .log-line .msg.ok {
            color: #16a34a;
        }

        .log-line .msg.err {
            color: #dc2626;
        }

        .log-line .msg.info {
            color: #2563eb;
        }

        .log-line .msg.warn {
            color: #d97706;
        }

        /* Status */
        .status {
            margin-top: 16px;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            padding: 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.ok {
            border-color: #16a34a;
            color: #16a34a;
        }

        .status.err {
            border-color: #dc2626;
            color: #dc2626;
        }

        .cursor-blink {
            animation: blink 0.7s step-end infinite;
        }

        .stats {
            margin-top: 40px;
            font-family: 'Space Mono', monospace;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: #bbb;
            letter-spacing: 2px;
        }

        .footer em {
            font-style: normal;
            color: #2563eb;
        }

        .corner {
            position: fixed;
            width: 20px;
            height: 20px;
            border-color: #ddd;
            border-style: solid;
            border-width: 0;
        }

        .corner.tl { top: 20px; left: 20px; border-top-width: 1px; border-left-width: 1px; }
        .corner.tr { top: 20px; right: 20px; border-top-width: 1px; border-right-width: 1px; }
        .corner.bl { bottom: 20px; left: 20px; border-bottom-width: 1px; border-left-width: 1px; }
        .corner.br { bottom: 20px; right: 20px; border-bottom-width: 1px; border-right-width: 1px; }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scan-line"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="container">
        <div class="header">
            <div class="logo">u<em>Video</em></div>
            <div class="tagline">video downloader</div>
        </div>

        <div class="main-box">
            <div class="input-wrapper">
                <span class="prefix">~$</span>
                <input type="text" id="url" placeholder="paste url video disini..." autocomplete="off" spellcheck="false">
                <button class="btn-paste" id="btn-paste" type="button" title="Paste dari clipboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                    paste
                </button>
                <button class="btn" id="btn">ambil</button>
            </div>

            <div class="progress-section" id="progress-section">
                <div class="progress-header">
                    <span class="progress-file" id="progress-file">video.mp4</span>
                    <span class="progress-percent" id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="progress-info">
                    <span id="progress-size">0 MB / 0 MB</span>
                    <span class="progress-speed" id="progress-speed">0 MB/s</span>
                </div>
            </div>

            <div class="log-output" id="log-output"></div>

            <div id="status" class="status">
                <span class="cursor-blink">█</span> <span id="status-text"></span>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="count">0</div>
                <div class="stat-label">downloaded</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <em>u</em>video <em>//</em> <em>v</em>1.0
    </div>

    <script>
        const urlInput = document.getElementById('url');
        const btn = document.getElementById('btn');
        const btnPaste = document.getElementById('btn-paste');
        const progressSection = document.getElementById('progress-section');
        const progressFile = document.getElementById('progress-file');
        const progressPercent = document.getElementById('progress-percent');
        const progressBar = document.getElementById('progress-bar');
        const progressSize = document.getElementById('progress-size');
        const progressSpeed = document.getElementById('progress-speed');
        const logOutput = document.getElementById('log-output');
        const status = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const countEl = document.getElementById('count');
        let count = 0;
        let logLines = [];

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function addLog(msg, type = 'default') {
            const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${type}">${msg}</span>`;
            logOutput.appendChild(line);
            logOutput.scrollTop = logOutput.scrollHeight;
            logLines.push(line);
            if (logLines.length > 50) {
                const old = logLines.shift();
                old.remove();
            }
        }

        function clearLog() {
            logOutput.innerHTML = '';
            logLines = [];
        }

        function setStatus(type, text) {
            status.className = 'status show ' + type;
            statusText.textContent = text;
        }

        function showProgress(filename) {
            progressFile.textContent = filename;
            progressPercent.textContent = '0%';
            progressBar.style.width = '0%';
            progressSize.textContent = '0 MB / ...';
            progressSpeed.textContent = '0 MB/s';
            progressSection.classList.add('show');
        }

        function updateProgress(percent, downloaded, total, speed) {
            progressBar.style.width = percent + '%';
            progressPercent.textContent = Math.round(percent) + '%';
            progressSize.textContent = formatBytes(downloaded) + ' / ' + (total ? formatBytes(total) : '...');
            progressSpeed.textContent = formatBytes(speed) + '/s';
        }

        function hideProgress() {
            progressSection.classList.remove('show');
        }

        function startFakeProgress(filename, totalSize) {
            let downloaded = 0;
            let speed = 0;
            const startTime = Date.now();
            
            const interval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed < 1) {
                    speed = totalSize * 0.3;
                } else if (elapsed < 3) {
                    speed = totalSize * 0.1;
                } else {
                    speed = totalSize * 0.02 + Math.random() * totalSize * 0.01;
                }
                downloaded += speed * 0.5;
                if (totalSize) {
                    const percent = Math.min((downloaded / totalSize) * 100, 99);
                    updateProgress(percent, downloaded, totalSize, speed);
                } else {
                    updateProgress(Math.min(downloaded / (10 * 1024 * 1024) * 100, 99), downloaded, null, speed);
                }
            }, 500);
            
            return {
                stop: () => {
                    clearInterval(interval);
                    updateProgress(100, downloaded, totalSize, 0);
                }
            };
        }

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
        });

        btnPaste.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                urlInput.value = text;
                urlInput.focus();
            } catch {
                urlInput.focus();
            }
        });

        btn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) return;

            try { new URL(url); } catch {
                setStatus('err', 'url invalid');
                return;
            }

            btn.disabled = true;
            btn.textContent = '...';
            clearLog();
            hideProgress();
            status.className = 'status';

            addLog('memulai download...', 'info');
            addLog('url: ' + url, 'default');

            let fakeProgress = null;

            try {
                addLog('mendapatkan info file...', 'info');
                
                const res = await fetch('/api/download?url=' + encodeURIComponent(url));

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ error: 'error' }));
                    throw new Error(err.error || 'gagal');
                }

                const disp = res.headers.get('Content-Disposition');
                let name = 'video.mp4';
                if (disp) {
                    const m = disp.match(/filename="?([^"]+)"?/);
                    if (m) name = m[1];
                }

                const contentLength = res.headers.get('Content-Length');
                const totalSize = contentLength ? parseInt(contentLength) : null;

                addLog('file: ' + name, 'ok');
                if (totalSize) {
                    addLog('ukuran: ' + formatBytes(totalSize), 'info');
                } else {
                    addLog('ukuran: tidak diketahui', 'warn');
                }

                addLog('mulai download...', 'info');
                showProgress(name);

                fakeProgress = startFakeProgress(name, totalSize || 10 * 1024 * 1024);

                const blob = await res.blob();
                
                if (fakeProgress) fakeProgress.stop();

                addLog('download selesai!', 'ok');
                addLog('ukuran file: ' + formatBytes(blob.size), 'info');

                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                URL.revokeObjectURL(a.href);

                count++;
                countEl.textContent = count;
                setStatus('ok', 'done — ' + name);
                urlInput.value = '';

            } catch (err) {
                if (fakeProgress) fakeProgress.stop();
                addLog('error: ' + err.message, 'err');
                setStatus('err', err.message || 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'ambil';
            }
        });
    </script>
</body>
</html>
